<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global AI PC TALK</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --main: #3c3e40; --yellow: #fee500; --bg: #abc1d1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: sans-serif; background: #eee; }
        #app { display: flex; flex-direction: column; width: 100%; height: 100%; max-width: 500px; margin: 0 auto; background: white; }
        .tab { flex: 1; overflow-y: auto; display: none; padding: 20px; }
        .tab.active { display: flex; flex-direction: column; }
        #chat-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; display: none; flex-direction: column; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 10px; border-radius: 12px; font-size: 14px; word-break: break-all; position: relative; }
        .msg.me { align-self: flex-end; background: var(--yellow); border-top-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: white; border-top-left-radius: 2px; }
        .trans { display: block; margin-top: 5px; border-top: 1px dashed #ccc; padding-top: 5px; font-size: 12px; color: #d32f2f; font-weight: bold; }
        .nav { display: flex; height: 60px; background: #f9f9f9; border-top: 1px solid #ddd; }
        .nav button { flex: 1; border: none; background: none; font-size: 24px; cursor: pointer; }
        .input-area { display: flex; padding: 10px; background: white; gap: 5px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        input, button, select { font-size: 16px; border-radius: 8px; border: 1px solid #ddd; outline: none; }
    </style>
</head>
<body>
<div id="app">
    <div id="p-auth" class="tab active" style="justify-content:center; align-items:center;">
        <h1 style="color:var(--main); margin-bottom:30px;">PC TALK</h1>
        <input type="text" id="uid" placeholder="아이디" style="width:85%; padding:14px; margin-bottom:12px;">
        <input type="password" id="upw" placeholder="비밀번호" style="width:85%; padding:14px; margin-bottom:25px;">
        <button onclick="login()" style="width:85%; padding:14px; background:var(--main); color:white; border:none; font-weight:bold;">로그인</button>
        <p onclick="register()" style="color:gray; cursor:pointer; margin-top:20px; font-size:14px;">계정이 없으신가요? 회원가입</p>
    </div>

    <div id="p-main" style="display:none; flex:1; flex-direction:column;">
        <div id="t-friends" class="tab active">
            <div id="req-list"></div>
            <h4 style="margin:0 0 10px 0;">친구 추가</h4>
            <div style="display:flex; gap:8px; margin-bottom:25px;">
                <input type="text" id="fId" placeholder="ID 입력" style="flex:1; padding:10px;">
                <button onclick="sendReq()" style="padding:10px 20px; background:var(--main); color:white; border:none;">요청</button>
            </div>
            <h4 style="margin:0 0 10px 0;">내 친구</h4>
            <div id="friend-list"></div>
        </div>
        <div id="t-settings" class="tab">
            <div style="text-align:center;">
                <img id="my-pic" style="width:110px; height:110px; border-radius:45px; background:#eee; object-fit:cover; margin-bottom:15px;" onclick="document.getElementById('picInp').click()">
                <input type="file" id="picInp" style="display:none;" onchange="previewImg(this)">
                <h2 id="display-id" style="margin:0 0 15px 0;"></h2>
                <input type="text" id="statusInp" style="width:100%; padding:10px; margin-bottom:12px; text-align:center;">
                <select id="langSel" style="width:100%; padding:12px; margin-bottom:20px;">
                    <option value="ko">한국어 (Korean)</option>
                    <option value="en">영어 (English)</option>
                    <option value="ja">일본어 (Japanese)</option>
                    <option value="zh">중국어 (Chinese)</option>
                </select>
                <button onclick="saveProfile()" style="width:100%; padding:14px; background:var(--main); color:white; border:none; font-weight:bold;">프로필 저장</button>
                <button onclick="logout()" style="width:100%; padding:12px; margin-top:15px; background:#f0f0f0; border:none; color:#555;">로그아웃</button>
            </div>
        </div>
        <nav class="nav">
            <button onclick="showTab('friends', this)" style="color:orange;">👤</button>
            <button onclick="showTab('settings', this)">⚙️</button>
        </nav>
    </div>
</div>

<div id="chat-ui">
    <header style="height:60px; background:var(--main); color:white; display:flex; align-items:center; padding:0 15px;">
        <button onclick="closeChat()" style="color:white; background:none; border:none; font-size:26px; cursor:pointer;">←</button>
        <span id="chat-title" style="margin-left:15px; font-weight:bold; font-size:18px;">대화방</span>
    </header>
    <div id="messages"></div>
    <div class="input-area">
        <input type="text" id="mInp" placeholder="@bot 질문하기..." style="flex:1; padding:12px; border:1px solid #eee;" onkeypress="if(event.keyCode==13) sendMsg()">
        <button onclick="sendMsg()" style="background:var(--yellow); border:none; padding:12px 22px; font-weight:bold; cursor:pointer;">전송</button>
    </div>
</div>

<script>
    const socket = io(); let me = null; let curRoom = "";

    window.onload = async () => {
        const saved = localStorage.getItem('talkUser');
        if(saved) {
            const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:saved });
            const d = await res.json();
            if(d.success) { me = d.user; startApp(); }
        }
    }

    async function login() {
        const body = JSON.stringify({userId:uid.value, password:upw.value});
        const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body });
        const d = await res.json();
        if(d.success) { me = d.user; localStorage.setItem('talkUser', body); startApp(); }
        else alert("아이디 또는 비밀번호가 올바르지 않습니다.");
    }

    async function register() {
        const res = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:uid.value, password:upw.value})});
        const d = await res.json(); d.success ? alert("가입 성공! 로그인을 진행하세요.") : alert(d.message);
    }

    function startApp() {
        document.getElementById('p-auth').style.display = 'none';
        document.getElementById('p-main').style.display = 'flex';
        updateUI();
    }

    function openChat(f) {
        curRoom = [me.userId, f].sort().join('_');
        document.getElementById('chat-title').innerText = f;
        document.getElementById('chat-ui').style.display = 'flex';
        document.getElementById('messages').innerHTML = "";
        socket.emit('join_room', curRoom);
    }
    function closeChat() { document.getElementById('chat-ui').style.display = 'none'; curRoom = ""; }

    function sendMsg() {
        const inp = document.getElementById('mInp');
        const text = inp.value.trim();
        if(!text) return;
        // fetch를 거치지 않고 소켓으로만 전송
        socket.emit('send_message', { room:curRoom, userId:me.userId, content:text, senderLang:me.language });
        inp.value = "";
    }

    socket.on('chat_logs', logs => logs.forEach(m => appendMsg(m)));
    socket.on('receive_message', d => { if(d.room === curRoom) appendMsg(d); });

    async function appendMsg(d) {
        const isMe = d.userId === me.userId;
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'me' : 'other'}`;
        
        let html = `<b style="font-size:11px; opacity:0.7;">${d.userId}</b><br>${d.content}`;
        
        // 번역: 내가 아니고, AI가 아니며, 언어가 다를 때만 실행
        if (!isMe && d.userId !== "🤖 AI봇" && d.senderLang !== me.language) {
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(d.content)}&langpair=${d.senderLang}|${me.language}`);
                const t = await res.json();
                html += `<span class="trans">🌐 ${t.responseData.translatedText}</span>`;
            } catch(e) {}
        }
        
        div.innerHTML = html;
        const box = document.getElementById('messages');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function showTab(t, btn) {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.getElementById('t-'+t).classList.add('active');
        document.querySelectorAll('.nav button').forEach(b => b.style.color = 'black');
        btn.style.color = 'orange';
    }

    function updateUI() {
        document.getElementById('friend-list').innerHTML = me.friends.map(f => `<div style="padding:15px; border-bottom:1px solid #eee; cursor:pointer;" onclick="openChat('${f}')">👤 ${f}</div>`).join('') || '<p style="text-align:center; color:gray;">친구가 없습니다.</p>';
        document.getElementById('req-list').innerHTML = me.pendingRequests.map(id => `<div style="background:#fff9c4; padding:12px; border-radius:8px; margin-bottom:15px; font-size:14px;">${id}님의 친구 요청 <button onclick="handle('${id}','accept')" style="padding:4px 10px; margin-left:10px;">수락</button></div>`).join('');
        document.getElementById('display-id').innerText = me.userId;
        document.getElementById('statusInp').value = me.statusMsg;
        document.getElementById('langSel').value = me.language;
        document.getElementById('my-pic').src = me.profilePic || 'https://via.placeholder.com/110';
    }

    async function saveProfile() {
        const body = { userId:me.userId, profilePic:document.getElementById('my-pic').src, statusMsg:document.getElementById('statusInp').value, language:document.getElementById('langSel').value };
        await fetch('/update-profile', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
        me.language = body.language; alert("프로필이 저장되었습니다.");
    }

    function previewImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => document.getElementById('my-pic').src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function sendReq() {
        await fetch('/send-request', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:me.userId, friendId:fId.value})});
        alert("요청을 보냈습니다."); fId.value = "";
    }

    async function handle(requesterId, action) {
        await fetch('/handle-request', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:me.userId, requesterId, action})});
        location.reload();
    }

    function logout() { localStorage.removeItem('talkUser'); location.reload(); }
</script>
</body>
</html>
