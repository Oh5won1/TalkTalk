<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC TALK</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --main: #3c3e40; --yellow: #fee500; --bg: #abc1d1; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #eee; height: 100vh; display: flex; justify-content: center; align-items: center; }

        /* 메인 윈도우 크기 고정 */
        .window { width: 360px; height: 620px; background: white; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden; display: none; flex-direction: column; }
        .active { display: flex; }

        /* 로그인 섹션 */
        #p-auth { padding: 40px 20px; text-align: center; justify-content: center; }
        .logo { font-size: 32px; font-weight: bold; color: var(--main); margin-bottom: 40px; }
        input { width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 6px; }
        .btn-login { background: var(--yellow); }
        .btn-reg { background: #f5f5f5; border: 1px solid #ddd; }

        /* 리스트 섹션 */
        header { padding: 15px; background: #f9f9f9; font-weight: bold; border-bottom: 1px solid #eee; }
        .list-item { padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; }
        .list-item:hover { background: #f8f8f8; }
        .profile-img { width: 40px; height: 40px; background: #ddd; border-radius: 14px; margin-right: 12px; }

        /* 채팅 섹션 */
        #p-chat { background: var(--bg); }
        .chat-head { padding: 12px; background: var(--main); color: white; display: flex; align-items: center; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.4; }
        .msg.me { align-self: flex-end; background: var(--yellow); }
        .msg.other { align-self: flex-start; background: white; }
        .input-box { display: flex; padding: 10px; background: white; gap: 5px; }
        .input-box input { margin: 0; }
        .input-box button { width: 60px; margin: 0; background: var(--yellow); }
    </style>
</head>
<body>

    <div id="p-auth" class="window active">
        <div class="logo">PC TALK</div>
        <input type="text" id="uid" placeholder="아이디">
        <input type="password" id="upw" placeholder="비밀번호">
        <button class="btn-login" onclick="login()">로그인</button>
        <button class="btn-reg" onclick="register()">계역 만들기</button>
    </div>

    <div id="p-main" class="window">
        <header>대화창</header>
        <div class="list-item" onclick="openChat('global_room', '전체 대화방')">
            <div class="profile-img"></div>
            <b>전체 대화방 입장하기</b>
        </div>
    </div>

    <div id="p-chat" class="window">
        <div class="chat-head">
            <button onclick="goBack()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer; width:30px;">◀</button>
            <span id="chat-title" style="margin-left:10px;"></span>
        </div>
        <div id="messages"></div>
        <div class="input-box">
            <input type="text" id="mInp" onkeypress="if(event.keyCode==13) sendMsg()">
            <button onclick="sendMsg()">전송</button>
        </div>
    </div>

    <script>
        const socket = io();
        let me = null;
        let curRoom = "";

        function showPage(id) {
            document.querySelectorAll('.window').forEach(w => w.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function login() {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: uid.value, password: upw.value })
            });
            const d = await res.json();
            if (d.success) { me = d.user; showPage('p-main'); }
            else alert("로그인 실패");
        }

        async function register() {
            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: uid.value, password: upw.value })
            });
            const d = await res.json(); alert(d.success ? "가입 성공" : "가입 실패");
        }

        function openChat(room, title) {
            curRoom = room;
            document.getElementById('chat-title').innerText = title;
            document.getElementById('messages').innerHTML = "";
            socket.emit('join_room', room);
            showPage('p-chat');
        }

        function goBack() { showPage('p-main'); }

        function sendMsg() {
            const text = mInp.value.trim();
            if (!text) return;
            socket.emit('send_message', { room: curRoom, userId: me.userId, content: text });
            mInp.value = "";
        }

        socket.on('chat_logs', logs => logs.forEach(m => appendMsg(m)));
        socket.on('receive_message', data => { if (data.room === curRoom) appendMsg(data); });

        function appendMsg(data) {
            const div = document.createElement('div');
            div.className = `msg ${data.userId === me.userId ? 'me' : 'other'}`;
            div.innerHTML = `<b>${data.userId}</b><br>${data.content}`;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
