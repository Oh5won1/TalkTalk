<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Global AI PC TALK</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --main: #3c3e40; --yellow: #fee500; --bg: #abc1d1; }
        body { font-family: sans-serif; margin: 0; background: #f0f2f5; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 400px; height: 100vh; background: white; display: flex; flex-direction: column; }
        .tab { flex: 1; overflow-y: auto; display: none; padding: 20px; }
        .tab.active { display: block; }
        .nav { display: flex; background: #f9f9f9; border-top: 1px solid #ddd; }
        .nav button { flex: 1; padding: 15px; border: none; font-size: 20px; cursor: pointer; background:none; }
        .profile-section { text-align: center; padding: 20px 0; border-bottom: 1px solid #eee; }
        .circle-img { width: 100px; height: 100px; border-radius: 40px; object-fit: cover; background: #eee; cursor: pointer; }
        .item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #f9f9f9; cursor: pointer; }
        #chat-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; display: none; flex-direction: column; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.4; }
        .msg.me { align-self: flex-end; background: var(--yellow); }
        .msg.other { align-self: flex-start; background: white; }
        .trans { display: block; margin-top: 5px; border-top: 1px dashed #ccc; padding-top: 5px; color: #333; font-weight: bold; }
    </style>
</head>
<body>
<div id="app">
    <div id="p-auth" class="tab active" style="text-align:center; padding-top:100px;">
        <h1>PC TALK</h1>
        <input type="text" id="uid" placeholder="아이디" style="width:80%; padding:10px;"><br><br>
        <input type="password" id="upw" placeholder="비밀번호" style="width:80%; padding:10px;"><br><br>
        <button onclick="login()" style="width:85%; padding:10px; background:var(--main); color:white; border:none;">로그인</button>
        <p onclick="register()" style="color:gray; cursor:pointer;">회원가입</p>
    </div>

    <div id="p-main" style="display:none; flex:1; flex-direction:column;">
        <div id="t-friends" class="tab active">
            <div id="req-list"></div>
            <h4>친구 추가</h4>
            <div style="display:flex; gap:5px; margin-bottom:20px;">
                <input type="text" id="fId" style="flex:1;"> <button onclick="sendReq()">요청</button>
            </div>
            <h4>친구 목록</h4>
            <div id="friend-list"></div>
        </div>
        
        <div id="t-settings" class="tab">
            <div class="profile-section">
                <img id="my-pic" class="circle-img" onclick="document.getElementById('picInp').click()">
                <input type="file" id="picInp" style="display:none;" onchange="previewImg(this)">
                <h2 id="display-id"></h2>
                <input type="text" id="statusInp" placeholder="상태 메시지" style="width:80%; text-align:center; padding:5px;"><br><br>
                <select id="langSel" style="width:85%; padding:10px;">
                    <option value="ko">한국어</option>
                    <option value="en">영어</option>
                    <option value="ja">일본어</option>
                    <option value="zh">중국어</option>
                </select><br><br>
                <button onclick="saveProfile()" style="background:var(--main); color:white; padding:10px 20px; border:none;">저장</button>
                <button onclick="logout()" style="padding:10px;">로그아웃</button>
            </div>
        </div>

        <nav class="nav">
            <button onclick="showTab('friends', this)" style="color:orange;">👤</button>
            <button onclick="showTab('settings', this)">⚙️</button>
        </nav>
    </div>
</div>

<div id="chat-ui">
    <header style="padding:15px; background:var(--main); color:white; display:flex; justify-content:space-between;">
        <button onclick="document.getElementById('chat-ui').style.display='none'" style="color:white; background:none; border:none;">←</button>
        <span id="chat-title">대화</span><div></div>
    </header>
    <div id="messages"></div>
    <div style="padding:10px; background:white; display:flex;">
        <input type="text" id="mInp" style="flex:1; padding:10px;" onkeypress="if(event.keyCode==13) sendMsg()" placeholder="@bot 질문하기">
        <button onclick="sendMsg()" style="background:var(--yellow); border:none; padding:10px;">전송</button>
    </div>
</div>

<script>
    const socket = io(); let me = null; let curRoom = "";

    // 알림 권한 요청
    if (Notification.permission !== "granted") Notification.requestPermission();

    window.onload = async () => {
        const saved = localStorage.getItem('talkUser');
        if(saved) {
            const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:saved });
            const d = await res.json();
            if(d.success) { me = d.user; startApp(); }
        }
    }

    async function login() {
        const body = JSON.stringify({userId:uid.value, password:upw.value});
        const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body });
        const d = await res.json();
        if(d.success) { me = d.user; localStorage.setItem('talkUser', body); startApp(); }
        else alert(d.message);
    }

    async function register() {
        const res = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:uid.value, password:upw.value})});
        const d = await res.json(); alert(d.message);
    }

    function startApp() {
        document.getElementById('p-auth').style.display = 'none';
        document.getElementById('p-main').style.display = 'flex';
        updateUI();
    }

    function updateUI() {
        document.getElementById('friend-list').innerHTML = me.friends.map(f => `<div class="item" onclick="openChat('${f}')">${f}</div>`).join('');
        document.getElementById('req-list').innerHTML = me.pendingRequests.map(id => `<div>${id} 요청 <button onclick="handle('${id}','accept')">수락</button></div>`).join('');
        document.getElementById('display-id').innerText = me.userId;
        document.getElementById('statusInp').value = me.statusMsg;
        document.getElementById('langSel').value = me.language;
        document.getElementById('my-pic').src = me.profilePic || 'https://via.placeholder.com/100';
    }

    async function saveProfile() {
        const profilePic = document.getElementById('my-pic').src;
        const statusMsg = document.getElementById('statusInp').value;
        const language = document.getElementById('langSel').value;
        await fetch('/update-profile', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:me.userId, profilePic, statusMsg, language})});
        me.language = language; alert("저장 완료");
    }

    function previewImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => document.getElementById('my-pic').src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function translateText(text, from, to) {
        if (from === to) return text;
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
        const d = await res.json();
        return d.responseData.translatedText;
    }

    function openChat(f) {
        curRoom = [me.userId, f].sort().join('_');
        document.getElementById('chat-title').innerText = f;
        document.getElementById('chat-ui').style.display = 'flex';
        document.getElementById('messages').innerHTML = "";
        socket.emit('join_room', curRoom);
    }

    async function sendMsg() {
        const text = mInp.value;
        if(!text) return;
        socket.emit('send_message', { room:curRoom, userId:me.userId, content:text, senderLang:me.language });
        mInp.value = "";

        if (text.startsWith("@bot")) {
            const res = await fetch('/ask-ai', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt: text.replace("@bot","")})});
            const d = await res.json();
            if(d.success) socket.emit('send_message', { room:curRoom, userId:"🤖 Qwen봇", content:d.answer, senderLang:"ko" });
        }
    }

    socket.on('chat_logs', logs => logs.forEach(m => appendMsg(m)));
    socket.on('receive_message', d => {
        if (d.userId !== me.userId) {
            const isOpen = document.getElementById('chat-ui').style.display === 'flex';
            if (!isOpen || curRoom !== d.room) {
                new Notification("PC TALK", { body: `${d.userId}: ${d.content}` });
            }
        }
        appendMsg(d);
    });

    async function appendMsg(d) {
        const div = document.createElement('div');
        div.className = `msg ${d.userId === me.userId ? 'me' : 'other'}`;
        let html = `<b>${d.userId}</b><br><span>${d.content}</span>`;
        if (d.userId !== me.userId && d.userId !== "🤖 Qwen봇" && d.senderLang !== me.language) {
            const t = await translateText(d.content, d.senderLang, me.language);
            html += `<span class="trans">🌐 ${t}</span>`;
        }
        div.innerHTML = html;
        const box = document.getElementById('messages');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function showTab(t, btn) {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.getElementById('t-'+t).classList.add('active');
        document.querySelectorAll('.nav button').forEach(x => x.style.color = 'black');
        btn.style.color = 'orange';
    }
    async function sendReq() {
        await fetch('/send-request', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:me.userId, friendId:fId.value})});
        alert("요청 보냄");
    }
    async function handle(requesterId, action) {
        await fetch('/handle-request', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:me.userId, requesterId, action})});
        location.reload();
    }
    function logout() { localStorage.removeItem('talkUser'); location.reload(); }
</script>
</body>
</html>
