<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI PC TALK</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --main: #3c3e40; --yellow: #fee500; --bg: #abc1d1; }
        body { margin: 0; font-family: sans-serif; background: #eee; height: 100vh; display: flex; flex-direction: column; }
        #chat-ui { display: none; flex-direction: column; height: 100%; background: var(--bg); }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px; border-radius: 10px; font-size: 14px; }
        .msg.me { align-self: flex-end; background: var(--yellow); }
        .msg.other { align-self: flex-start; background: white; }
        .input-area { display: flex; padding: 10px; background: white; gap: 5px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background: var(--yellow); border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="auth-ui" style="padding: 50px; text-align: center;">
        <h1>PC TALK</h1>
        <input type="text" id="uid" placeholder="ID"><br><br>
        <input type="password" id="upw" placeholder="PW"><br><br>
        <button onclick="login()">로그인</button>
        <button onclick="register()">가입</button>
    </div>

    <div id="chat-ui">
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="mInp" placeholder="@bot 질문하기..." onkeypress="if(event.keyCode==13) sendMsg()">
            <button onclick="sendMsg()">전송</button>
        </div>
    </div>

    <script>
        const socket = io();
        let me = null;
        let curRoom = "global_room"; // 테스트용 기본 방

        async function login() {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: uid.value, password: upw.value })
            });
            const d = await res.json();
            if (d.success) {
                me = d.user;
                document.getElementById('auth-ui').style.display = 'none';
                document.getElementById('chat-ui').style.display = 'flex';
                socket.emit('join_room', curRoom);
            } else alert("실패");
        }

        async function register() {
            await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: uid.value, password: upw.value })
            });
            alert("가입 완료");
        }

        function sendMsg() {
            const inp = document.getElementById('mInp');
            const text = inp.value.trim();
            if (!text) return;

            // 핵심: fetch 없이 오직 소켓으로만 보냄
            socket.emit('send_message', {
                room: curRoom,
                userId: me.userId,
                content: text,
                senderLang: "ko"
            });
            inp.value = "";
        }

        socket.on('receive_message', (data) => {
            const div = document.createElement('div');
            div.className = `msg ${data.userId === me.userId ? 'me' : 'other'}`;
            div.innerHTML = `<b>${data.userId}</b><br>${data.content}`;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        });
    </script>
</body>
</html>
