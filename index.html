<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global PC TALK</title>
    <script src="/socket.io/socket.io.js"></script>
    <!-- 모션 인식 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <style>
        :root { --main: #3c3e40; --yellow: #fee500; --bg: #abc1d1; }
        body { font-family: sans-serif; margin: 0; background: #f0f2f5; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 400px; height: 100vh; background: white; display: flex; flex-direction: column; position: relative; }
        .tab { flex: 1; overflow-y: auto; display: none; padding: 20px; }
        .tab.active { display: block; }
        .nav { display: flex; background: #f9f9f9; border-top: 1px solid #ddd; }
        .nav button { flex: 1; padding: 15px; border: none; font-size: 20px; cursor: pointer; background: none; }
        #chat-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; display: none; flex-direction: column; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 10px; font-size: 14px; position: relative; }
        .msg.me { align-self: flex-end; background: var(--yellow); }
        .msg.other { align-self: flex-start; background: white; }
        .trans-text { display: block; margin-top: 4px; border-top: 1px dashed #ccc; padding-top: 4px; color: #333; }
        /* 모션 인식 카메라 화면 스타일 */
        #motion-preview { position: fixed; bottom: 70px; right: 10px; width: 100px; height: 80px; border: 2px solid var(--yellow); border-radius: 10px; overflow: hidden; z-index: 1000; background: black; display: none; }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: rotateY(180deg); }
    </style>
</head>
<body>
<div id="app">
    <!-- 로그인/메인 화면 생략 (기존과 동일)[cite: 2] -->
</div>

<!-- 채팅 UI -->
<div id="chat-ui">
    <header style="padding:15px; background:var(--main); color:white; display:flex; justify-content:space-between; align-items:center;">
        <button onclick="closeChat()" style="color:white; background:none; border:none; font-size:20px;">←</button>
        <span id="chat-title">대화중</span><div></div>
    </header>
    <div id="messages"></div>
    <div id="motion-preview"><video id="webcam" autoplay playsinline></video></div>
    <div style="padding:10px; background:white; display:flex;">
        <input type="text" id="mInp" placeholder="@bot에게 질문하세요!" style="flex:1; padding:10px; border:1px solid #ddd; border-radius:20px;" onkeypress="if(event.keyCode==13) sendMsg()">
        <button onclick="sendMsg()" style="background:var(--yellow); border:none; padding:10px 15px; border-radius:20px; margin-left:5px;">전송</button>
    </div>
</div>

<script>
    const socket = io(); let me = null; let curRoom = "";
    const videoElement = document.getElementById('webcam');
    let isMotionActive = false;

    // 모션 인식 설정[cite: 2]
    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.7 });
    hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const lm = results.multiHandLandmarks[0];
            if (lm[8].y < lm[6].y - 0.1) sendMotionMsg("✋ 안녕! (모션 인식)"); // 검지 올리기 제스처[cite: 2]
        }
    });

    const camera = new Camera(videoElement, {
        onFrame: async () => { await hands.send({image: videoElement}); },
        width: 160, height: 120
    });

    function openChat(f) {
        curRoom = [me.userId, f].sort().join('_');
        document.getElementById('chat-title').innerText = f;
        document.getElementById('chat-ui').style.display = 'flex';
        document.getElementById('motion-preview').style.display = 'block';
        if (!isMotionActive) { camera.start(); isMotionActive = true; }
        socket.emit('join_room', curRoom);
    }

    function closeChat() {
        document.getElementById('chat-ui').style.display = 'none';
        document.getElementById('motion-preview').style.display = 'none';
    }

    // 메시지 출력 로직 (AI 및 번역 포함)[cite: 2]
    async function appendMsg(d) {
        const div = document.createElement('div');
        div.className = `msg ${d.userId === me.userId ? 'me' : 'other'}`;
        
        if (d.userId === "🤖 AI봇") {
            div.innerHTML = `<b style="font-size:10px; color:#555;">AI Assistant</b><br><span>${d.content}</span>`;
        } else {
            let contentHtml = `<span>${d.content}</span>`;
            if (d.userId !== me.userId && d.senderLang !== me.language) {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(d.content)}&langpair=${d.senderLang}|${me.language}`);
                const data = await res.json();
                contentHtml = `<span class="original-text">${d.content}</span><span class="trans-text">🌐 ${data.responseData.translatedText}</span>`;
            }
            div.innerHTML = contentHtml;
        }
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    function sendMsg() {
        if(mInp.value) {
            socket.emit('send_message', { room:curRoom, userId:me.userId, content:mInp.value, senderLang:me.language });
            mInp.value = "";
        }
    }

    let lastM = 0;
    function sendMotionMsg(txt) {
        if (Date.now() - lastM < 3000) return;
        lastM = Date.now();
        socket.emit('send_message', { room:curRoom, userId:me.userId, content:txt, senderLang:me.language });
    }

    socket.on('receive_message', d => appendMsg(d));
    socket.on('chat_logs', logs => { document.getElementById('messages').innerHTML = ""; logs.forEach(appendMsg); });
    // 기타 login, register 함수는 기존 소스 유지[cite: 2]
</script>
</body>
</html>
