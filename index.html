<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global AI PC TALK</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --main: #3c3e40; --yellow: #fee500; --bg: #abc1d1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #f0f2f5; font-family: sans-serif; }
        
        #app { display: flex; flex-direction: column; width: 100%; height: 100%; max-width: 500px; margin: 0 auto; background: white; position: relative; }
        
        .tab { flex: 1; overflow-y: auto; display: none; padding: 20px; -webkit-overflow-scrolling: touch; }
        .tab.active { display: flex; flex-direction: column; }
        
        #chat-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; display: none; flex-direction: column; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { max-width: 80%; padding: 10px; border-radius: 12px; font-size: 14px; position: relative; word-break: break-all; }
        .msg.me { align-self: flex-end; background: var(--yellow); border-top-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: white; border-top-left-radius: 2px; }
        .trans { display: block; margin-top: 5px; border-top: 1px dashed #ccc; padding-top: 5px; font-size: 13px; color: #d33; font-weight: bold; }
        
        .nav { display: flex; height: 60px; background: #f9f9f9; border-top: 1px solid #ddd; }
        .nav button { flex: 1; border: none; background: none; font-size: 24px; cursor: pointer; }

        input, select, button { font-size: 16px; border-radius: 5px; border: 1px solid #ddd; }
        .input-area { display: flex; padding: 10px; background: white; gap: 5px; }
    </style>
</head>
<body>
<div id="app">
    <div id="p-auth" class="tab active" style="justify-content: center; align-items: center;">
        <h1 style="color:var(--main)">PC TALK</h1>
        <input type="text" id="uid" placeholder="아이디" style="width:80%; padding:12px; margin-bottom:10px;">
        <input type="password" id="upw" placeholder="비밀번호" style="width:80%; padding:12px; margin-bottom:20px;">
        <button onclick="login()" style="width:80%; padding:12px; background:var(--main); color:white; border:none; font-weight:bold;">로그인</button>
        <p onclick="register()" style="color:gray; cursor:pointer; margin-top:15px;">계정이 없으신가요? 회원가입</p>
    </div>

    <div id="p-main" style="display:none; flex:1; flex-direction:column;">
        <div id="t-friends" class="tab active">
            <div id="req-list"></div>
            <h4 style="margin-top:0">친구 추가</h4>
            <div style="display:flex; gap:5px; margin-bottom:20px;">
                <input type="text" id="fId" placeholder="친구 ID 입력" style="flex:1; padding:8px;">
                <button onclick="sendReq()" style="padding:8px 15px;">요청</button>
            </div>
            <h4>친구 목록</h4>
            <div id="friend-list"></div>
        </div>
        
        <div id="t-settings" class="tab">
            <div style="text-align:center;">
                <img id="my-pic" style="width:100px; height:100px; border-radius:40px; object-fit:cover; background:#eee;" onclick="document.getElementById('picInp').click()">
                <input type="file" id="picInp" style="display:none;" onchange="previewImg(this)">
                <h2 id="display-id" style="margin:10px 0;"></h2>
                <input type="text" id="statusInp" style="width:100%; padding:8px; margin-bottom:10px; text-align:center;">
                <select id="langSel" style="width:100%; padding:10px; margin-bottom:15px;">
                    <option value="ko">한국어 (Korean)</option>
                    <option value="en">영어 (English)</option>
                    <option value="ja">일본어 (Japanese)</option>
                    <option value="zh">중국어 (Chinese)</option>
                </select>
                <button onclick="saveProfile()" style="width:100%; padding:12px; background:var(--main); color:white; border:none; margin-bottom:10px;">설정 저장</button>
                <button onclick="logout()" style="width:100%; padding:10px; background:#eee; border:none;">로그아웃</button>
            </div>
        </div>
        <nav class="nav">
            <button onclick="showTab('friends', this)" style="color:orange;">👤</button>
            <button onclick="showTab('settings', this)">⚙️</button>
        </nav>
    </div>
</div>

<div id="chat-ui">
    <header style="height:60px; background:var(--main); color:white; display:flex; align-items:center; padding:0 15px; justify-content:space-between;">
        <button onclick="closeChat()" style="color:white; background:none; border:none; font-size:20px;">←</button>
        <span id="chat-title" style="font-weight:bold;">대화방</span>
        <div style="width:20px;"></div>
    </header>
    <div id="messages"></div>
    <div class="input-area">
        <input type="text" id="mInp" placeholder="@bot 질문하기..." style="flex:1; padding:10px; border:none; outline:none;" onkeypress="if(event.keyCode==13) sendMsg()">
        <button onclick="sendMsg()" style="background:var(--yellow); border:none; padding:10px 20px; font-weight:bold;">전송</button>
    </div>
</div>

<script>
    const socket = io(); let me = null; let curRoom = "";

    // 1. 초기화 및 알림 설정
    if (Notification.permission !== "granted") Notification.requestPermission();

    window.onload = async () => {
        const saved = localStorage.getItem('talkUser');
        if(saved) {
            const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:saved });
            const d = await res.json();
            if(d.success) { me = d.user; startApp(); }
        }
    }

    // 2. 인증 로직
    async function login() {
        const body = JSON.stringify({userId:uid.value, password:upw.value});
        const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body });
        const d = await res.json();
        if(d.success) { me = d.user; localStorage.setItem('talkUser', body); startApp(); }
        else alert(d.message);
    }
    async function register() {
        const res = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:uid.value, password:upw.value})});
        const d = await res.json(); d.success ? alert("가입 성공! 로그인 하세요.") : alert(d.message);
    }

    function startApp() {
        document.getElementById('p-auth').style.display = 'none';
        document.getElementById('p-main').style.display = 'flex';
        updateUI();
    }

    // 3. 채팅 로직
    function openChat(f) {
        curRoom = [me.userId, f].sort().join('_');
        document.getElementById('chat-title').innerText = f;
        document.getElementById('chat-ui').style.display = 'flex';
        document.getElementById('messages').innerHTML = "";
        socket.emit('join_room', curRoom);
    }

    function closeChat() { document.getElementById('chat-ui').style.display = 'none'; curRoom = ""; }

    async function sendMsg() {
        const inp = document.getElementById('mInp');
        const text = inp.value.trim();
        if(!text) return;

        const msgData = { room:curRoom, userId:me.userId, content:text, senderLang:me.language };
        socket.emit('send_message', msgData);
        inp.value = "";

        if (text.startsWith("@bot")) {
            const res = await fetch('/ask-ai', { 
                method:'POST', 
                headers:{'Content-Type':'application/json'}, 
                body:JSON.stringify({prompt: text.replace("@bot","").trim()})
            });
            const d = await res.json();
            if(d.success) {
                socket.emit('send_message', { room:curRoom, userId:"🤖 AI 봇", content:d.answer, senderLang:"ko" });
            }
        }
    }

    socket.on('chat_logs', logs => logs.forEach(m => appendMsg(m)));
    socket.on('receive_message', d => {
        if (d.userId !== me.userId) {
            if (document.getElementById('chat-ui').style.display !== 'flex' || curRoom !== d.room) {
                new Notification("새 메시지", { body: `${d.userId}: ${d.content}` });
            }
        }
        appendMsg(d);
    });

    async function appendMsg(d) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        const isMe = (d.userId === me.userId);
        div.className = `msg ${isMe ? 'me' : 'other'}`;
        
        let html = `<div style="font-size:11px; margin-bottom:4px; opacity:0.7;">${d.userId}</div><span>${d.content}</span>`;
        
        // 번역 로직: 내가 아니고, AI가 아니며, 언어가 다를 때만
        if (!isMe && d.userId !== "🤖 AI 봇" && d.senderLang !== me.language) {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(d.content)}&langpair=${d.senderLang}|${me.language}`);
            const tData = await res.json();
            html += `<span class="trans">🌐 ${tData.responseData.translatedText}</span>`;
        }
        
        div.innerHTML = html;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    // 4. UI 및 유틸리티
    function showTab(t, btn) {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.getElementById('t-'+t).classList.add('active');
        document.querySelectorAll('.nav button').forEach(x => x.style.color = 'black');
        btn.style.color = 'orange';
    }
    function updateUI() {
        document.getElementById('friend-list').innerHTML = me.friends.length ? me.friends.map(f => `<div style="padding:15px; border-bottom:1px solid #eee; cursor:pointer;" onclick="openChat('${f}')">👤 ${f}</div>`).join('') : '<p style="color:gray; text-align:center;">친구가 없습니다.</p>';
        document.getElementById('req-list').innerHTML = me.pendingRequests.map(id => `<div style="background:#fff9c4; padding:10px; border-radius:5px; margin-bottom:10px;">${id}님이 친구 요청 <button onclick="handle('${id}','accept')">수락</button> <button onclick="handle('${id}','reject')">거절</button></div>`).join('');
        document.getElementById('display-id').innerText = me.userId;
        document.getElementById('statusInp').value = me.statusMsg;
        document.getElementById('langSel').value = me.language;
        document.getElementById('my-pic').src = me.profilePic || 'https://via.placeholder.com/100';
    }
    async function saveProfile() {
        const body = { userId:me.userId, profilePic:document.getElementById('my-pic').src, statusMsg:document.getElementById('statusInp').value, language:document.getElementById('langSel').value };
        await fetch('/update-profile', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
        me.language = body.language; alert("프로필이 저장되었습니다.");
    }
    function previewImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => document.getElementById('my-pic').src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }
    async function sendReq() {
        const fId = document.getElementById('fId').value;
        await fetch('/send-request', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:me.userId, friendId:fId})});
        alert("요청을 보냈습니다."); document.getElementById('fId').value = "";
    }
    async function handle(requesterId, action) {
        await fetch('/handle-request', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:me.userId, requesterId, action})});
        location.reload();
    }
    function logout() { localStorage.removeItem('talkUser'); location.reload(); }
</script>
</body>
</html>
