<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PC TALK Professional</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --main: #3c3e40; --yellow: #fee500; --bg: #abc1d1; }
        body { font-family: sans-serif; margin: 0; background: #f0f2f5; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 400px; height: 100vh; background: white; display: flex; flex-direction: column; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .tab { flex: 1; overflow-y: auto; display: none; padding: 20px; }
        .tab.active { display: block; }
        .nav { display: flex; background: #f9f9f9; border-top: 1px solid #ddd; }
        .nav button { flex: 1; padding: 15px; border: none; font-size: 20px; cursor: pointer; }
        .item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
        .req-box { background: #fff9c4; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #fbc02d; font-size: 14px; }
        #chat-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; display: none; flex-direction: column; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 70%; padding: 8px 12px; border-radius: 10px; font-size: 14px; }
        .msg.me { align-self: flex-end; background: var(--yellow); }
        .msg.other { align-self: flex-start; background: white; }
    </style>
</head>
<body>
<div id="app">
    <div id="p-auth" class="tab active" style="text-align:center; padding-top:100px;">
        <h1>PC TALK</h1>
        <input type="text" id="uid" placeholder="아이디" style="width:80%; padding:10px; margin-bottom:10px;"><br>
        <input type="password" id="upw" placeholder="비밀번호" style="width:80%; padding:10px; margin-bottom:20px;"><br>
        <button onclick="login()" style="width:85%; padding:12px; background:var(--main); color:white; border:none; border-radius:5px;">로그인</button><br>
        <button onclick="register()" style="margin-top:15px; background:none; border:none; color:gray;">회원가입</button>
    </div>

    <div id="p-main" style="display:none; flex:1; flex-direction:column;">
        <div id="t-friends" class="tab active">
            <div id="req-list"></div>
            <h4 style="margin:0 0 10px 0;">친구 찾기</h4>
            <div style="display:flex; gap:5px; margin-bottom:20px;">
                <input type="text" id="fSearch" style="flex:1; padding:8px;" placeholder="상대방 아이디">
                <button onclick="sendReq()">요청</button>
            </div>
            <h4 style="margin:0 0 10px 0;">친구 목록</h4>
            <div id="friend-list"></div>
        </div>
        <nav class="nav">
            <button onclick="location.reload()">🔄</button>
            <button onclick="logout()" style="font-size: 14px;">로그아웃</button>
        </nav>
    </div>
</div>

<div id="chat-ui">
    <header style="padding:15px; background:var(--main); color:white; display:flex; justify-content:space-between; align-items:center;">
        <button onclick="document.getElementById('chat-ui').style.display='none'" style="color:white; background:none; border:none; font-size:20px;">←</button>
        <span id="c-name">대화</span><div></div>
    </header>
    <div id="messages"></div>
    <div style="padding:10px; background:white; display:flex;">
        <input type="text" id="mInp" style="flex:1; padding:10px; border:1px solid #ddd; border-radius:20px;" onkeypress="if(event.keyCode==13) sendMsg()">
        <button onclick="sendMsg()" style="margin-left:5px; background:var(--yellow); border:none; padding:10px 15px; border-radius:20px;">전송</button>
    </div>
</div>

<script>
    const socket = io(); let me = null; let curRoom = "";

    // [중요] 페이지 로드 시 자동 로그인 체크
    window.onload = async () => {
        const saved = localStorage.getItem('talkUser');
        if (saved) {
            const parsed = JSON.parse(saved);
            const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(parsed)});
            const d = await res.json();
            if(d.success) { me = d.user; showMain(); }
        }
    };

    async function register() {
        const res = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:uid.value, password:upw.value})});
        const d = await res.json(); alert(d.message);
    }

    async function login() {
        const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:uid.value, password:upw.value})});
        const d = await res.json();
        if(d.success) {
            me = d.user;
            localStorage.setItem('talkUser', JSON.stringify({userId:uid.value, password:upw.value}));
            showMain();
        } else alert(d.message);
    }

    function showMain() {
        document.getElementById('p-auth').style.display = 'none';
        document.getElementById('p-main').style.display = 'flex';
        renderUI();
    }

    function renderUI() {
        // 친구 목록
        document.getElementById('friend-list').innerHTML = me.friends.map(f => `<div class="item" onclick="openChat('${f}')">${f}</div>`).join('');
        // 받은 요청
        const rList = document.getElementById('req-list');
        if(me.pendingRequests.length > 0) {
            rList.innerHTML = me.pendingRequests.map(id => `
                <div class="req-box">${id}님의 친구 요청
                    <button onclick="handle('${id}', 'accept')">수락</button>
                    <button onclick="handle('${id}', 'reject')">거절</button>
                </div>`).join('');
        } else rList.innerHTML = "";
    }

    async function sendReq() {
        const res = await fetch('/send-request', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:me.userId, friendId:fSearch.value})});
        const d = await res.json(); alert(d.message);
    }

    async function handle(requesterId, action) {
        const res = await fetch('/handle-request', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:me.userId, requesterId, action})});
        const d = await res.json(); if(d.success) location.reload();
    }

    function openChat(f) {
        curRoom = [me.userId, f].sort().join('_');
        socket.emit('join_room', curRoom);
        document.getElementById('c-name').innerText = f;
        document.getElementById('chat-ui').style.display = 'flex';
        document.getElementById('messages').innerHTML = "";
    }

    function sendMsg() {
        if(mInp.value) { socket.emit('send_message', { room:curRoom, userId:me.userId, content:mInp.value }); mInp.value = ""; }
    }

    socket.on('receive_message', d => {
        const div = document.createElement('div');
        div.className = `msg ${d.userId === me.userId ? 'me' : 'other'}`;
        div.innerText = d.content;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    function logout() { localStorage.removeItem('talkUser'); location.reload(); }
</script>
</body>
</html>
